<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>กระนวนไรเดอร์ — VeloSync Premium</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* 🔒 คงฟอนต์ดั้งเดิมไว้ 100% ห้ามแก้ */
@font-face{font-family:Seed;src:url("../assets/fonts/LINESeedSansTH_W_Rg.woff2") format("woff2");font-weight:400}
@font-face{font-family:Seed;src:url("../assets/fonts/LINESeedSansTH_W_Bd.woff2") format("woff2");font-weight:700}
:root{
  --ac:#ff5722; --rgb:255,87,34; --ac2:#ff8a5c;
  --s0:#0a0a0c; --s1:rgba(20,20,24,0.85); --s2:#121216; --bg:#0a0a0c; --top:#121216;
  --tx:#ffffff; --tx2:#8b94a5; --ln:rgba(255,255,255,0.06); --ln2:rgba(255,255,255,0.12);
  --chip:rgba(18,19,23,.85); --btn:#1f2024; --navbg:rgba(18,19,23,.9); --navtx:#8b94a5; --navon:#ff5722; --navtile:rgba(255,87,34,.15);
  --tilebg:rgba(255,87,34,.1); --tileln:rgba(255,87,34,.25); --ok:#00e676; --okrgb:0,230,118; --warn:#ffb74d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.6 Seed,"Noto Sans Thai",Tahoma,sans-serif;-webkit-font-smoothing:antialiased;background-image: radial-gradient(circle at 50% 0%, rgba(255,87,34,0.08) 0%, transparent 40%);}

.app{max-width:480px;background:transparent;min-height:100vh;margin:auto;padding-bottom:110px;position:relative;box-shadow:0 0 50px rgba(0,0,0,.8)}

/* Map: Edge-to-Edge Design */
#realMapContainer{height:clamp(320px,50vh,450px);position:relative;background:var(--s2);margin:0;border-radius:0;overflow:hidden;border-bottom:1px solid var(--ln2);z-index:1}
#realMap{height:100%;width:100%}
#realMapContainer::after{content:'';position:absolute;bottom:0;left:0;right:0;height:120px;background:linear-gradient(to top, var(--bg) 0%, transparent 100%);z-index:390;pointer-events:none}

/* Topbar Overlay (Floating) */
.topbar{padding:calc(16px + env(safe-area-inset-top, 0px)) 20px 16px;background:linear-gradient(to bottom, rgba(10,10,12,0.95) 0%, rgba(10,10,12,0.6) 60%, transparent 100%);display:flex;align-items:center;justify-content:space-between;gap:12px;position:absolute;top:0;left:0;right:0;z-index:500;pointer-events:none}
.topbar > * {pointer-events:auto}
.topbar strong{font-size:20px;font-weight:700;line-height:1.2;display:block;color:var(--tx);letter-spacing:-0.5px;display:flex;align-items:center;gap:8px}
.topbar small{display:block;color:var(--ac);font-size:10px;letter-spacing:.15em;font-weight:700;margin-bottom:4px;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:10px}

/* Profile Pill */
.mepill{display:flex;align-items:center;gap:8px;background:rgba(20,20,24,0.6);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:30px;padding:4px 14px 4px 4px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.rider-mini-avatar{width:32px;height:32px;border-radius:50%;background:var(--ac);display:grid;place-items:center;color:#fff;flex:none;font-weight:700;font-size:14px;overflow:hidden}
.rider-mini-avatar img{width:100%;height:100%;object-fit:cover}
.online-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2);font-weight:600}
.online-status i{width:6px;height:6px;border-radius:50%;background:var(--tx2);transition:all .3s}
.online-status.on{color:var(--ok)}.online-status.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}

/* SOS Button */
.sosbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(217,48,37,0.9);backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:30px;padding:8px 14px;font-size:12px;font-weight:700;box-shadow:0 4px 15px rgba(217,48,37,.3);transition:all .2s}
.sosbtn:hover{transform:scale(1.05);background:#d93025}
.sosbtn .ic{width:16px;height:16px}

/* XP Bar & Level */
.xp-container{position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,0.05);z-index:600}
.xp-fill{height:100%;background:linear-gradient(90deg, #ffb74d, var(--ac));width:0%;transition:width 0.5s;box-shadow:0 0 10px var(--ac)}
.level-badge{background:linear-gradient(135deg, rgba(255,87,34,0.2), rgba(255,87,34,0.05));color:var(--ac2);border:1px solid rgba(255,87,34,0.3);font-size:10px;font-weight:900;padding:2px 8px;border-radius:20px;letter-spacing:0.5px}

/* Map Top Chips */
.maptop{position:absolute;top:calc(80px + env(safe-area-inset-top, 0px));left:16px;right:16px;display:flex;justify-content:space-between;gap:8px;z-index:400}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(18,19,23,0.7);backdrop-filter:blur(12px);padding:6px 12px;border-radius:20px;font-size:11px;border:1px solid rgba(255,255,255,.08);font-weight:600;color:var(--tx);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.chip .ic{width:14px;height:14px;color:var(--ac)}

/* Map Stats Overlay */
.mapstats{position:absolute;left:0;right:0;bottom:0;z-index:400;padding:60px 20px 20px;background:linear-gradient(to top,var(--bg) 0%,rgba(10,10,12,0.8) 40%,rgba(10,10,12,0) 100%);display:grid;grid-template-columns:repeat(3,1fr);gap:12px;pointer-events:none}
.mapstats span{display:block;font-size:10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
.mapstats strong{display:block;font-size:20px;line-height:1.3;color:#fff;font-weight:800;letter-spacing:-0.5px}
.mapstats div:first-child strong{color:var(--ac2)}

/* Content Area */
.content{padding:0 20px 24px;position:relative;z-index:10;margin-top:-10px}
.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:20px 0 16px}
.sectiontitle h1{font-size:22px;font-weight:800;margin:0;color:var(--tx);letter-spacing:-0.5px}
.pill{font-size:10px;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.05);color:var(--tx2);border:1px solid rgba(255,255,255,.1);font-weight:700}

/* Premium Goal HUD */
.goal-hud{display:flex;align-items:center;gap:12px;background:var(--s1);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:16px;margin:16px 0;box-shadow:0 10px 30px rgba(0,0,0,0.4);position:relative;overflow:hidden}
.goal-hud::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--ac);box-shadow:0 0 15px var(--ac);border-radius:3px 0 0 3px}
.ring-svg{width:66px;height:66px;flex:none;transform:rotate(-90deg)}
.ring-svg circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring-bg{stroke:rgba(255,255,255,0.05)}
.ring-fill{stroke:url(#gradient);stroke-dasharray:201;stroke-dashoffset:201;transition:stroke-dashoffset 1s ease-out;filter:drop-shadow(0 0 6px rgba(255,87,34,0.4))}
.goal-txt{flex:1}
.goal-txt h3{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:6px}
.goal-txt h3 .ic{width:14px;height:14px;color:var(--ac)}
.goal-txt p{margin:0;font-size:17px;color:var(--tx);font-weight:800;letter-spacing:-0.5px}
.goal-txt small{display:block;font-size:11px;color:var(--tx2);margin-top:2px;font-weight:500}
.goal-txt .pct{color:var(--ac2);font-weight:700}

/* 🏃‍♂️ Mascot Animation */
.mascot-box{position:relative;width:64px;height:72px;display:flex;align-items:flex-end;justify-content:center;margin-left:auto;flex:none}
.mascot{width:100%;height:100%;transition:all 0.5s ease;transform-origin:bottom center;}
.mascot path,.mascot rect,.mascot circle{transition:all 0.5s ease;}
.sweat-drop{opacity:0;transition:opacity 0.5s}
.smile{opacity:0;transition:opacity 0.5s}
.crown{opacity:0;transition:opacity 0.5s}

/* State: Tired (0-30%) */
.state-tired .mascot{animation:breathe 2s infinite ease-in-out}
.state-tired .arm-left{transform:rotate(10deg)}
.state-tired .arm-right{transform:rotate(-10deg)}
.state-tired .sweat-drop{opacity:1;animation:drip 1.5s infinite}
.state-tired .head{transform:translateY(3px)}

/* State: Normal (31-70%) */
.state-normal .mascot{animation:walk 1s infinite ease-in-out}
.state-normal .arm-left{transform:rotate(-20deg)}
.state-normal .arm-right{transform:rotate(20deg)}

/* State: Excited (71-99%) */
.state-excited .mascot{animation:jump 0.6s infinite ease-in-out}
.state-excited .arm-left{transform:rotate(-140deg);transform-origin:top right}
.state-excited .arm-right{transform:rotate(140deg);transform-origin:top left}
.state-excited .smile{opacity:1}
.state-excited .head{transform:translateY(-2px)}

/* State: Win (100%) */
.state-win .mascot{animation:jump 0.4s infinite ease-in-out}
.state-win .arm-left{transform:rotate(-160deg);transform-origin:top right}
.state-win .arm-right{transform:rotate(160deg);transform-origin:top left}
.state-win .smile{opacity:1}
.state-win .crown{opacity:1;transform:translateY(-3px);animation:crownGlow 1s infinite alternate}
.state-win .head{transform:translateY(-2px)}

@keyframes breathe{0%,100%{transform:scaleY(0.98) translateY(1px)}50%{transform:scaleY(1.02)}}
@keyframes walk{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes jump{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-10px) scaleY(1.05)}}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(8px);opacity:0}}
@keyframes crownGlow{from{filter:drop-shadow(0 0 2px gold)}to{filter:drop-shadow(0 0 6px gold)}}

/* Stat Cards */
.dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.dash-stats button{background:var(--s1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:18px 10px;color:var(--tx);transition:all .3s;box-shadow:0 4px 15px rgba(0,0,0,.2);text-align:left}
.dash-stats button:hover{border-color:rgba(255,255,255,0.15);transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.4)}
.dash-stats strong{display:block;font-size:26px;color:var(--tx);font-weight:800;letter-spacing:-1px;margin-bottom:2px}
.dash-stats span{font-size:11px;color:var(--tx2);display:block;font-weight:600}

/* Job Cards */
.card{padding:20px;background:var(--s1);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.06);border-radius:24px;margin:14px 0;box-shadow:0 10px 30px rgba(0,0,0,.3);position:relative}
.jobhead{display:flex;align-items:center;gap:14px}
.avatar{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:var(--tx);flex:none}
.jobhead strong{display:block;font-size:16px;color:var(--tx);font-weight:700;display:flex;align-items:center;gap:6px}
.muted{color:var(--tx2);font-size:12px;margin-top:2px;display:block}
.amount{font-weight:800;font-size:22px;margin-left:auto;color:var(--tx);letter-spacing:-0.5px}
.urgent-badge{background:rgba(255,23,68,0.15);color:#ff1744;border:1px solid rgba(255,23,68,0.3);font-size:9px;padding:2px 6px;border-radius:6px;font-weight:700}

/* Timeline */
.timeline{margin:20px 0 16px;padding-left:10px}
.stop{border-left:2px dashed rgba(255,255,255,0.15);padding:0 0 20px 20px;position:relative;font-size:14px;color:var(--tx);font-weight:600}
.stop:last-child{border-left-color:transparent;padding-bottom:0}
.stop:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--s2);position:absolute;left:-7px;top:4px;border:2px solid var(--tx2)}
.stop:last-child:before{border-radius:3px;background:var(--ac);border-color:var(--ac);box-shadow:0 0 8px var(--ac)}
.stop small{display:block;font-size:11px;color:var(--tx2);margin-top:4px;font-weight:500}

/* Buttons */
.primary{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:14px 16px;font-size:14px;font-weight:700;box-shadow:0 4px 16px rgba(255,87,34,.3);transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.primary:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,87,34,.4)}
.secondary{border:1px solid rgba(255,255,255,0.12);color:var(--tx);background:rgba(255,255,255,0.03);border-radius:14px;padding:14px 16px;font-size:14px;text-decoration:none;font-weight:700;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.secondary:hover{background:rgba(255,255,255,0.08)}
.icon-btn{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);color:var(--tx);flex:none;transition:all .2s}
.icon-btn:hover{background:rgba(255,255,255,0.08)}
.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0;flex:1}
.full{width:100%}

/* Utility */
.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.state{font-size:12px;background:rgba(255,255,255,0.03);padding:14px;border-radius:14px;margin-bottom:14px;color:var(--tx2);border:1px solid rgba(255,255,255,0.08)}
.empty{text-align:center;padding:40px 16px;color:var(--tx2);font-size:13px;background:rgba(255,255,255,0.02);border-radius:24px;border:1px dashed rgba(255,255,255,0.1)}
#notice:empty{display:none}#notice{font-size:12px;padding:14px 16px;background:rgba(255,255,255,0.05);color:var(--tx);border-radius:16px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.1);font-weight:500}
.switch{margin:16px 0;display:flex;align-items:center;justify-content:space-between;background:var(--s1);padding:16px 20px;border-radius:20px;border:1px solid rgba(255,255,255,0.06)}
.switch span{font-weight:600;color:var(--tx);font-size:14px}
.switch button{border-radius:30px;padding:8px 16px;background:rgba(var(--okrgb),0.1);color:var(--ok);font-size:12px;font-weight:700;border:1px solid rgba(var(--okrgb),0.2);display:inline-flex;align-items:center;gap:6px;transition:all .3s}
.switch button.off{background:rgba(255,255,255,0.05);color:var(--tx2);border-color:rgba(255,255,255,0.1)}
.switch button i{width:6px;height:6px;border-radius:50%;background:currentColor}

/* Settings Form */
label{display:block;font-size:12px;margin:16px 0 8px;color:var(--tx2);font-weight:600}
input,select,textarea{width:100%;padding:14px;border:1px solid rgba(255,255,255,0.1);border-radius:14px;background:rgba(255,255,255,0.03);color:var(--tx);font-size:14px;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.card h2{display:flex;align-items:center;gap:10px;font-size:16px;margin:0 0 16px;color:var(--tx);font-weight:700}
.card h2 .ic{width:20px;height:20px;color:var(--ac)}
.profhead{display:flex;align-items:center;gap:16px}
.profhead strong{display:block;color:var(--tx);font-size:16px}
.bigav{position:relative;width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);display:grid;place-items:center;color:var(--tx2);flex:none;overflow:hidden}
.bigav img{width:100%;height:100%;object-fit:cover}
.camera{position:absolute;right:-4px;bottom:-4px;width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;cursor:pointer;border:2px solid var(--s1)}
.camera .ic{width:14px;height:14px}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.slotw{position:relative}
.slot{display:grid;place-items:center;aspect-ratio:1;margin:0;border-radius:16px;border:1px dashed rgba(255,255,255,0.2);background:rgba(255,255,255,0.02);color:var(--tx2);overflow:hidden;cursor:pointer;transition:all .2s}
.slot:hover{border-color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.05)}
.slot img{width:100%;height:100%;object-fit:cover}
.slotw .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.8);color:#fff;display:grid;place-items:center;padding:0;cursor:pointer;font-size:12px}
.hist{display:flex;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:14px}
.hist:last-child{border-bottom:0;padding-bottom:0}
.hist b{color:var(--tx);white-space:nowrap;font-size:15px}

/* Bottom Nav */
.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),450px);display:flex;background:var(--navbg);backdrop-filter:blur(20px);border-radius:30px;padding:8px;z-index:1000;border:1px solid rgba(255,255,255,.08);box-shadow:0 16px 40px rgba(0,0,0,.6)}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--navtx);font-size:10px;font-weight:600;padding:8px 4px;border-radius:24px;transition:all .2s}
.nav button.active{color:var(--navon);font-weight:700}
.nav .ic{width:22px;height:22px}
.nav button.active .tile{background:var(--navtile);color:var(--navon)}
.tile{display:grid;place-items:center;width:40px;height:32px;border-radius:16px;border:1px solid transparent;transition:all .2s}

/* Job Alert Modal */
#alert{position:fixed;inset:0;width:100%;height:100vh;padding:16px;display:flex;align-items:center;justify-content:center;background:rgba(10,10,12,.9);backdrop-filter:blur(12px);overscroll-behavior:contain;z-index:3000}
#alert:empty{display:none}
.alertcard{width:min(100%,460px);max-height:92vh;display:flex;flex-direction:column;padding:0;overflow:hidden;border-radius:28px;background:var(--s2);border:1px solid rgba(255,255,255,0.1);box-shadow:0 24px 80px rgba(0,0,0,.9);animation:jobIn .3s cubic-bezier(.2,1.2,.4,1)}
.alertscroll{overflow:auto;min-height:0;overscroll-behavior:contain}
.alerthead{padding:24px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid rgba(255,255,255,0.06)}
.alerthead .avatar{width:48px;height:48px;border-radius:16px;background:rgba(255,87,34,0.15);color:var(--ac);border-color:rgba(255,87,34,0.3)}
.alertheading{min-width:0;flex:1}
.alertheading h2{font-size:20px;line-height:1.3;margin:0;font-weight:800;color:var(--tx);display:flex;align-items:center;gap:8px}
.alertheading h2 .ic{width:20px;height:20px;color:var(--ac)}
.alertheading small{font-size:12px;color:var(--tx2);margin-top:2px;display:block}
.alertfee{text-align:right;flex:none}
.alertfee small{display:block;font-size:10px;color:var(--tx2);text-transform:uppercase;font-weight:700}
.alertfee strong{font-size:28px;color:var(--ac);line-height:1.1;font-weight:900;letter-spacing:-0.5px}

.alertphoto{position:relative;margin:20px;aspect-ratio:16/9;background:var(--s1);border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,0.05)}
.alertphoto img{display:block;width:100%;height:100%;object-fit:cover}
.alertphoto figcaption{position:absolute;inset:auto 0 0;padding:30px 20px 16px;background:linear-gradient(transparent,rgba(0,0,0,.9));color:#fff;font-size:18px;font-weight:700}
.photochip{position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:8px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);color:#fff;font-size:10px;font-weight:700;border:1px solid rgba(255,255,255,0.2)}

.alertbody{padding:0 20px 20px}
.admincheer{display:flex;gap:12px;align-items:flex-start;margin-bottom:20px}
.adminav{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,0.05);color:var(--tx2);flex:none;border:1px solid rgba(255,255,255,0.1)}
.adminbubble{flex:1;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:0 16px 16px 16px;padding:14px 16px}
.adminbubble small{display:block;font-size:10px;color:var(--tx2);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.adminbubble p{font-size:14px;font-weight:500;line-height:1.5;margin:0;color:var(--tx)}

.alertfooter{flex:none;padding:20px;background:var(--s2);border-top:1px solid rgba(255,255,255,0.06)}
.alertfooter .row{display:grid;grid-template-columns:1fr 1.8fr;gap:12px}
.alertfooter button{min-height:52px;font-size:15px;border-radius:16px}
.alertfooter p{margin:14px 0 0;font-size:11px;color:var(--tx2);text-align:center;font-weight:500}
.alertclock{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);margin-bottom:12px;font-weight:600}
.alertclock strong{color:var(--ac2)}
.alertbar{margin:12px 0 0;height:4px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden}
.alertbar i{display:block;height:100%;background:var(--ac);width:100%;transition:width .2s linear}

/* Bottom Bar for Active Job */
#jobbar{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;width:min(calc(100% - 24px),460px);z-index:1500}
#jobbar:empty{display:none}
.barcard{background:rgba(20,20,24,0.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.barinfo{flex:1;min-width:0}.barinfo strong,.barinfo span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hasbar .app{padding-bottom:240px}

/* Sheet (Bottom Sheet Dialog) */
#sheet:empty{display:none}#sheet{position:fixed;inset:0;z-index:2500;display:flex;align-items:flex-end;justify-content:center}
.shbg{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
.shpanel{position:relative;width:min(100%,480px);max-height:88vh;overflow:auto;background:var(--s2);border-radius:28px 28px 0 0;padding:24px 20px 32px;animation:rise .25s ease-out;border-top:1px solid rgba(255,255,255,0.1)}
.shpanel h3{margin:0 0 6px;font-size:18px;color:var(--tx);font-weight:700}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:16px;border:1px solid rgba(255,255,255,0.08);border-radius:16px;background:rgba(255,255,255,0.02);color:var(--tx);text-decoration:none;margin:10px 0;font-size:14px;font-weight:600;transition:all .2s}
.mrow:hover{border-color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.05)}
.mrow span{display:flex;align-items:center;gap:12px}.mrow .ic{color:var(--tx2)}.mrow b{color:var(--tx);font-size:16px}
.mrow.danger{background:rgba(217,48,37,0.15);color:#ff5252;border-color:rgba(217,48,37,0.3)}.mrow.danger .ic{color:#ff5252}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.opt{padding:10px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.02);color:var(--tx2);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.opt[aria-pressed=true]{border-color:var(--ac);color:var(--tx);background:rgba(255,87,34,0.15)}
.stars{display:flex;gap:12px;justify-content:center;margin:20px 0 10px}.stars button{border:0;background:none;padding:2px;color:rgba(255,255,255,0.1);cursor:pointer;transition:transform .2s}.stars button:hover{transform:scale(1.1)}.stars button.on{color:#ffb74d}.stars .ic{width:40px;height:40px;fill:currentColor;stroke:none}
.starlbl{text-align:center;font-size:14px;color:var(--tx2);margin-bottom:16px;font-weight:600}

@keyframes jobIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@media(min-width:650px){.app{margin:0 auto;border-left:1px solid var(--ln2);border-right:1px solid var(--ln2)}}
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============ Core Setup (ระบบหลังบ้านห้ามแก้) ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht=n=>'฿'+Number(n||0).toLocaleString('th-TH');
const JOB_KEY='kranuan_jobs2',PROF_KEY='kranuan_profile';
const cfg={mode:'local',url:'',key:'',riderId:'rider-1',support:''};
let tab='home',online=false,jobs=[],seen=null,pos=null,lastErr='',noticeTimer,lastPush=0;
const isLocal=()=>cfg.mode!=='supabase';

let dailyGoal = 500;
try { const savedGoal = localStorage.getItem('kranuan_goal'); if(savedGoal) dailyGoal = Number(savedGoal); } catch(e){}

function seed(){
  const now = Date.now(),mk=(i,shop,pickup,dropoff,km,fee,cn,min)=>({id:'J'+i,shop,pickup,dropoff,distance_km:km,fee,status:'pending',rider_id:null,customer_id:'c'+i,customer_name:cn,customer_phone:'080000000'+i,created_at:new Date(now-min*60000).toISOString(),pickup_lat:16.706,pickup_lng:103.078,dropoff_lat:16.715,dropoff_lng:103.085});
  return [
    mk(1,'ร้านก๋วยเตี๋ยวป้าแดง','ตลาดสดกระนวน','บ้านโนนสวรรค์ หมู่ 4',2.5,40,'คุณสมชาย',3),
    mk(2,'ร้านชานมกระนวน','หน้าโรงเรียนกระนวน','หมู่บ้านทุ่งนา หมู่ 2',1.8,30,'คุณมาลี',2),
    mk(3,'ครัวแม่ทองดี','ถนนมะลิวัลย์','บ้านขามเรียง',4.2,60,'คุณวิชัย',1)
  ];
}
function lsGet(){try{const l=JSON.parse(localStorage.getItem(JOB_KEY)||'null');if(Array.isArray(l))return l}catch(e){}const s=seed();lsSet(s);return s}
function lsSet(l){try{localStorage.setItem(JOB_KEY,JSON.stringify(l))}catch(e){}}
async function api(path,o={}){
  const r=await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1'+path,{...o,headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key,'Content-Type':'application/json',Prefer:'return=representation',...(o.headers||{})}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();return t?JSON.parse(t):null;
}
const BANKS=['ธนาคารกสิกรไทย','ธนาคารไทยพาณิชย์','ธนาคารกรุงเทพ','ธนาคารกรุงไทย','ธนาคารกรุงศรีอยุธยา','ธนาคารทหารไทยธนชาต','ธนาคารออมสิน','ธ.ก.ส.'];
let prof={name:'ไรเดอร์กระนวน',bank_name:'',bank_account:'',bank_holder:'',address:'',avatar_url:'',photos:[null,null,null,null],theme_accent:'orange',theme_surface:'black',sound:true,voice:true,emergency_name:'',emergency_phone:'',blocked:[]};
try{Object.assign(prof,JSON.parse(localStorage.getItem(PROF_KEY)||'{}'))}catch(e){}
if(!Array.isArray(prof.photos)||prof.photos.length!==4)prof.photos=[null,null,null,null];
function normProf(){
  if(!Array.isArray(prof.photos)||prof.photos.length!==4)prof.photos=[null,null,null,null];
  if(!Array.isArray(prof.blocked))prof.blocked=[];
  if(prof.voice === undefined) prof.voice = true;
}
normProf();

const me=()=>encodeURIComponent(cfg.riderId);
const DB={
  async jobs(){
    if(isLocal())return lsGet();
    return api('/jobs?select=*&order=created_at.desc&limit=100&or=(status.eq.pending,rider_id.eq.'+me()+')');
  },
  async claim(id){
    if(isLocal()){const l=lsGet(),j=l.find(x=>x.id===id);if(!j||j.status!=='pending')return false;j.status='accepted';j.rider_id=cfg.riderId;lsSet(l);return true}
    const r=await api('/jobs?id=eq.'+encodeURIComponent(id)+'&status=eq.pending',{method:'PATCH',body:JSON.stringify({status:'accepted',rider_id:cfg.riderId})});
    return !!(r&&r.length);
  },
  async patch(id,f){
    if(isLocal()){const l=lsGet();Object.assign(l.find(x=>x.id===id)||{},f);lsSet(l);return}
    await api('/jobs?id=eq.'+encodeURIComponent(id)+'&rider_id=eq.'+me(),{method:'PATCH',body:JSON.stringify(f)});
  },
  async presence(on){
    if(isLocal())return;
    await api('/riders',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:cfg.riderId,name:prof.name,online:on,lat:pos&&pos.lat,lng:pos&&pos.lng,updated_at:new Date().toISOString()})});
  },
  async log(kind,o){
    const row={rider_id:cfg.riderId,kind,created_at:new Date().toISOString(),...o};
    if(isLocal()){try{const l=JSON.parse(localStorage.getItem('kranuan_logs')||'[]');l.push(row);localStorage.setItem('kranuan_logs',JSON.stringify(l))}catch(e){}return}
    await api('/rider_reports',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(row)});
  },
  async getProfile(){if(isLocal())return null;const r=await api('/riders?id=eq.'+me()+'&select=*');return r&&r[0]},
  async saveProfile(p){
    try{localStorage.setItem(PROF_KEY,JSON.stringify(p))}catch(e){}
    if(isLocal())return;
    const o={id:cfg.riderId,updated_at:new Date().toISOString()};
    ['name','bank_name','bank_account','bank_holder','address','avatar_url','photos','theme_accent','theme_surface','emergency_name','emergency_phone','blocked'].forEach(k=>o[k]=p[k]);
    await api('/riders',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(o)});
  },
  async photo(slot,d){
    if(isLocal())return d;
    const b=await (await fetch(d)).blob(),path=me()+'/'+slot+'.jpg',base=cfg.url.replace(/\/$/,'')+'/storage/v1/object/';
    const r=await fetch(base+'rider-photos/'+path,{method:'POST',headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key,'x-upsert':'true','Content-Type':'image/jpeg'},body:b});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return base+'public/rider-photos/'+path+'?v='+Date.now();
  },
  reset(){lsSet(seed())}
};

const mine=()=>jobs.filter(j=>j.rider_id===cfg.riderId);
const active=()=>mine().find(j=>j.status==='accepted'||j.status==='picked');
const pending=()=>jobs.filter(j=>j.status==='pending'&&j.cancelled_by!==cfg.riderId&&!prof.blocked.some(b=>b.id===cust(j).id));
const done=()=>mine().filter(j=>j.status==='delivered').sort((a,b)=>String(b.delivered_at).localeCompare(String(a.delivered_at)));
const isToday=s=>s&&new Date(s).toDateString()===new Date().toDateString();
const sum=l=>l.reduce((s,j)=>s+Number(j.fee||0),0);
const mapUrl=(t,la,ln)=>'https://www.google.com/maps/dir/?api=1&dir_action=navigate&travelmode=two-wheeler&destination='+encodeURIComponent(la!=null&&la!==''&&ln!=null&&ln!==''?la+','+ln:t+' กระนวน ขอนแก่น');
const dest=j=>j.status==='picked'?[j.dropoff,j.dropoff_lat,j.dropoff_lng,'นำทางไปส่ง']:[j.pickup,j.pickup_lat,j.pickup_lng,'นำทางไปร้าน'];
const MORE=j=>`<button class="secondary ico" data-act="sheet" data-id="menu:${esc(j.id)}" aria-label="ตัวเลือกงาน" style="flex:none;width:48px;padding:0"><svg class="ic"><use href="#i-more"/></svg></button>`;
const navBtn=j=>{const d=dest(j);return `<a class="secondary" target="_blank" rel="noopener" href="${mapUrl(d[0],d[1],d[2])}"><svg class="ic" style="width:18px;height:18px"><use href="#i-nav"/></svg>${d[3]}</a>`};
const callBtn=j=>j.customer_phone?`<a class="icon-btn" href="tel:${esc(j.customer_phone)}" title="โทรหาลูกค้า"><svg class="ic"><use href="#i-phone"/></svg></a>`:'';
const STATUS={pending:'รอรับงาน',accepted:'รับงานแล้ว',picked:'รับของแล้ว',delivered:'ส่งสำเร็จ'};

function getJobAge(created_at) {
  if(!created_at) return 0;
  return Math.floor((Date.now() - new Date(created_at).getTime()) / 60000);
}

function jobCard(j,withAct){
  let act='';
  const age = getJobAge(j.created_at);
  const urgentBadge = (j.status === 'pending' && age >= 3) ? `<span class="urgent-badge">รอ ${age} น.</span>` : '';

  if(withAct){
    if(j.status==='pending')act=`<div class="row">${navBtn(j)}${callBtn(j)}<button class="primary" data-act="accept" data-id="${esc(j.id)}" style="flex:2">รับงานนี้</button>${MORE(j)}</div>`;
    if(j.status==='accepted')act=`<div class="row">${navBtn(j)}${callBtn(j)}<button class="primary" data-act="picked" data-id="${esc(j.id)}" style="flex:2">รับของแล้ว</button>${MORE(j)}</div>`;
    if(j.status==='picked')act=`<div class="row">${navBtn(j)}${callBtn(j)}<button class="primary" data-act="delivered" data-id="${esc(j.id)}" style="flex:2">ส่งสำเร็จ</button>${MORE(j)}</div>`;
  }
  return `<div class="card"><div class="jobhead"><div class="avatar"><svg class="ic"><use href="#i-scooter"/></svg></div><div><strong>${esc(j.shop)} ${urgentBadge}</strong><span class="muted">${esc(STATUS[j.status]||j.status)} · ${esc(j.distance_km)} กม.</span></div><div class="amount">${baht(j.fee)}</div></div>
  <div class="timeline"><div class="stop">${esc(j.pickup)}<small>จุดรับของ</small></div><div class="stop">${esc(j.dropoff)}<small>จุดส่งของ</small></div></div>${j.customer_name?`<div class="muted" style="margin:0 0 10px">ลูกค้า: ${esc(j.customer_name)}</div>`:''}${act}</div>`;
}

function homeView(){
  const a=active(),p=pending(),d=done(),t=d.filter(j=>isToday(j.delivered_at));
  const todaySum = sum(t);
  const goalPercent = Math.min(100, Math.max(0, (todaySum / dailyGoal) * 100));
  const circ = 2 * Math.PI * 32; 
  const offset = circ - (goalPercent / 100) * circ;

  // 🏃‍♂️ กำหนดท่าทางมาสคอตตาม %
  let mascotState = 'state-tired';
  if (goalPercent >= 100) mascotState = 'state-win';
  else if (goalPercent >= 71) mascotState = 'state-excited';
  else if (goalPercent >= 31) mascotState = 'state-normal';

  // Rider Level Calculation (1 Level per 10 jobs)
  const totalJobs = d.length;
  const currentLevel = Math.floor(totalJobs / 10) + 1;
  const xpPercent = ((totalJobs % 10) / 10) * 100;
  
  setTimeout(() => {
    const fill = document.getElementById('xpFill');
    if(fill) fill.style.width = xpPercent + '%';
    const lv = document.getElementById('levelBadge');
    if(lv) lv.textContent = `Lv.${currentLevel}`;
    const ring = document.getElementById('goalRingFill');
    if(ring) ring.style.strokeDashoffset = offset;
  }, 100);

  return `<div class="sectiontitle"><h1>ศูนย์บัญชาการ</h1><span class="pill">${isLocal()?'โหมดทดลอง':'เชื่อมฐานข้อมูลแล้ว'}</span></div>
  
  <div class="goal-hud">
    <svg class="ring-svg" viewBox="0 0 72 72">
      <defs>
        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#ffb74d" />
          <stop offset="100%" stop-color="#ff5722" />
        </linearGradient>
      </defs>
      <circle class="ring-bg" cx="36" cy="36" r="32"></circle>
      <circle class="ring-fill" id="goalRingFill" cx="36" cy="36" r="32"></circle>
    </svg>
    <div class="goal-txt">
      <h3><svg class="ic"><use href="#i-target"/></svg> เป้าหมายวันนี้</h3>
      <p>${baht(todaySum)} <small>/ ${baht(dailyGoal)}</small></p>
      <small>สู้ๆ อีกนิด! <span class="pct">(${goalPercent.toFixed(0)}%)</span></small>
    </div>
    
    <!-- 🏃‍♂️ อนิเมชั่นมาสคอต -->
    <div class="mascot-box ${mascotState}">
      <svg class="mascot" viewBox="0 0 100 100">
        <!-- มงกุฎ (แสดงตอน 100%) -->
        <path class="crown" d="M 40 25 L 45 15 L 50 22 L 55 15 L 60 25 Z" fill="#ffd700"/>
        
        <!-- หัว -->
        <g class="head">
          <!-- หมวกกันน็อก -->
          <path d="M 35 45 C 35 25 65 25 65 45 Z" fill="var(--ac)"/>

 if(!cheerBag.length){cheerBag=[...ISAN_CHEERS];for(let i=cheerBag.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));[cheerBag[i],cheerBag[k]]=[cheerBag[k],cheerBag[i]]}if(cheerBag.at(-1)===lastCheer)[cheerBag[0],cheerBag[cheerBag.length-1]]=[cheerBag.at(-1),cheerBag[0]]}
 return lastCheer=cheerBag.pop();

function jobPhoto(j){
 for(const [value,label] of [[j.shop_image_url,'ภาพหน้าร้าน'],[j.shop_image,'ภาพหน้าร้าน'],[j.product_image_url,'ภาพสินค้า'],[j.product_image,'ภาพสินค้า'],[j.image_url,'ภาพประกอบงาน']]){

// 🎙️ Voice Assistant Feature
function speakText(text) {
  if(!prof.voice || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'th-TH';
  utter.rate = 1.1;
  utter.pitch = 1;
  window.speechSynthesis.speak(utter);
}
function speakJob(j) {
  const text = `มีภารกิจใหม่ จาก ${j.shop} ไปส่งที่ ${j.dropoff} ค่าตอบแทน ${j.fee} บาท`;
  speakText(text);
}

// 🎉 Confetti Effect
function fireConfetti() {
  const colors = ['#ff5722', '#ffb74d', '#00e676', '#29b6f6', '#ffffff'];
  for(let i=0; i<50; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
    p.style.animationDelay = (Math.random() * 0.5) + 's';
    p.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 3500);
  }
}

function detect(){
 const p=pending(),ids=new Set(p.map(j=>j.id));
 queue=queue.filter(j=>j.id==='TEST'||(online&&!active()&&ids.has(j.id)));
 if(cur&&cur.id!=='TEST'&&!alertBusy&&(!online||active()||!ids.has(cur.id)))nextAlert();
 if(!seen){seen=ids;return}
 p.filter(j=>!seen.has(j.id)).forEach(j=>{seen.add(j.id);if(online&&!active())notify(j)});
}
function notify(j){
 if(j.id!=='TEST'&&(!online||active()))return;
 if(cur?.id===j.id||queue.some(x=>x.id===j.id))return;
 queue.push(j);if(!cur)nextAlert();beep();
 speakJob(j); // 🔊 Voice announcement
 const n=$('#alertQueue');if(n)n.textContent=queue.length?'รออีก '+queue.length+' งาน':'ภารกิจใหม่สำหรับคุณ';
 try{if(document.hidden&&window.Notification&&Notification.permission==='granted')new Notification('ภารกิจใหม่ '+baht(j.fee),{body:j.shop+' → '+j.dropoff})}catch(e){}
}
function lockAlert(on){
 if(on===alertLocked)return;alertLocked=on;
 if(on){alertFocus=document.activeElement;oldOverflow=document.body.style.overflow;document.body.style.overflow='hidden'}
 document.querySelectorAll('.app > :not(#alert)').forEach(el=>{if(on){el.dataset.alertWasInert=el.inert?'1':'0';el.inert=true}else{el.inert=el.dataset.alertWasInert==='1';delete el.dataset.alertWasInert}});
 if(!on){document.body.style.overflow=oldOverflow;if(alertFocus?.isConnected&&!alertFocus.disabled)alertFocus.focus();else $('#nav button')?.focus()}
}
function setAlertButtons(disabled){$('#alert').querySelectorAll('button').forEach(b=>b.disabled=disabled)}
function startAlertClock(){
 clearInterval(alertTimer);
 const tick=()=>{if(!cur||alertBusy)return;const left=Math.max(0,alertDeadline-Date.now());if(!left){nextAlert();return}const n=$('#alertSeconds'),bar=$('#alertProgress');if(n)n.textContent=Math.ceil(left/1000);if(bar)bar.style.width=left/ALERT_DURATION*100+'%'};
 alertTimer=setInterval(tick,250);tick();
}
function nextAlert(){
 clearInterval(alertTimer);cur=queue.shift()||null;const el=$('#alert');
 if(!cur){el.innerHTML='';lockAlert(false);return}
 const j=cur,photo=jobPhoto(j);alertDeadline=Date.now()+ALERT_DURATION;
 el.innerHTML='<section class="alertcard"><div class="alertscroll">'+
 '<header class="alerthead"><div class="avatar"><svg class="ic"><use href="#i-bell"/></svg></div><div class="alertheading"><h2 id="alertTitle">ภารกิจใหม่!</h2><small id="alertQueue">'+(queue.length?'รออีก '+queue.length+' งาน':'ภารกิจใหม่สำหรับคุณ')+'</small></div><div class="alertfee"><small>ค่าตอบแทน</small><strong>'+baht(j.fee)+'</strong></div></header>'+
 '<figure class="alertphoto"><img id="alertPhoto" src="'+esc(photo.url)+'" alt=""><span class="photochip" id="alertPhotoLabel">'+esc(photo.label)+'</span><figcaption>'+esc(j.shop)+'</figcaption></figure>'+
 '<div class="alertbody"><div class="admincheer"><div class="adminav"><svg class="ic"><use href="#i-chat"/></svg></div><div class="adminbubble"><small>VeloSync · กำลังใจอัตโนมัติ</small><p id="alertCheer">'+esc(randomCheer())+'</p></div></div>'+
 '<div class="timeline"><div class="stop"><small>จุดรับของ · ระยะทาง '+esc(j.distance_km??'–')+' กม.</small>'+esc(j.pickup)+'</div><div class="stop"><small>จุดส่งของ</small>'+esc(j.dropoff)+'</div></div></div>'+
 '</div><footer class="alertfooter"><div class="alertclock"><span>ตัดสินใจภายใน</span><strong><span id="alertSeconds">30</span> วินาที</strong></div><div class="row"><button class="secondary" data-act="dismiss">ข้าม</button><button class="primary" data-act="takeAlert">'+(j.id==='TEST'?'ทดสอบ':'รับภารกิจ')+'</button></div><div class="alertbar" aria-hidden="true"><i id="alertProgress"></i></div><p>ขับขี่ปลอดภัย ตรวจสอบเส้นทางก่อนรับงาน</p></footer></section>';
 const img=$('#alertPhoto');img.onerror=()=>{img.onerror=null;img.src=SHOP_PLACEHOLDER;$('#alertPhotoLabel').textContent='ภาพประกอบ'};
 lockAlert(true);el.querySelector('[data-act="takeAlert"]').focus();startAlertClock();
}
document.addEventListener('keydown',e=>{
 if(!cur)return;
 if(e.key==='Escape'){e.preventDefault();if(!alertBusy)nextAlert();return}
 if(e.key==='Tab'){const buttons=[...$('#alert').querySelectorAll('button:not(:disabled)')];if(!buttons.length){e.preventDefault();return}const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});

const REASONS={

function sheetHTML(){
  if(!sh)return '';
  const j=sh.job?jobOf(sh.job):null,c=j?cust(j):{name:'ลูกค้า'},f=sh.f,t=sh.t;
  const head=(a,b)=>`<h3>${a}</h3><p class="muted" style="margin:0 0 16px">${b||''}</p>`;
  const ch=l=>`<div class="chips">${l.map(r=>`<button class="opt" data-act="sfset" data-id="reason:${r}" aria-pressed="${f.reason===r}">${r}</button>`).join('')}</div>`;
  const note=`<label>รายละเอียดเพิ่มเติม (ถ้ามี)</label><textarea data-sf="detail" rows="3">${esc(f.detail)}</textarea>`;
  const msg=sh.msg?`<div class="state">${esc(sh.msg)}</div>`:'';
  const foot=(act,label,cls='primary')=>`${msg}<div class="row" style="margin-top:20px"><button class="secondary" data-act="closeSheet">${t==='rate'?'ข้าม':'ปิด'}</button><button class="${cls}" data-act="${act}">${label}</button></div>`;
  const mr=(ic,label,id,cls='')=>`<button class="mrow ${cls}" data-act="sheet" data-id="${esc(id)}"><span><svg class="ic"><use href="#i-${ic}"/></svg>${label}</span></button>`;
  const tel=(n,l)=>`<a class="mrow" href="tel:${esc(n.replace(/[^0-9+]/g,''))}"><span>${l}</span><b>${esc(n)}</b></a>`;
  let b='';
  if(t==='menu'){
    const live=j&&j.rider_id===cfg.riderId&&(j.status==='accepted'||j.status==='picked'),blocked=prof.blocked.some(x=>x.id===c.id),id=j?j.id:'';
    b=head('ตัวเลือกงาน',j?`${esc(j.shop)} · ลูกค้า ${esc(c.name)}`:'')+(live?mr('x','ยกเลิกงานนี้','cancel:'+id,'danger'):'')+(j&&j.status==='delivered'&&!j.rider_rating?mr('star','ให้คะแนนลูกค้า','rate:'+id):'')+mr('flag','รายงานลูกค้า','report:'+id)+(blocked?'<p class="muted">ลูกค้ารายนี้ถูกบล็อกอยู่แล้ว</p>':mr('ban','บล็อกลูกค้า','block:'+id))+mr('chat','ร้องเรียน / ขอความช่วยเหลือ','complaint:'+id)+'<button class="secondary full" style="margin-top:16px" data-act="closeSheet">ปิด</button>';
  }else if(t==='cancel')b=head('ยกเลิกงาน','เลือกเหตุผลการยกเลิก')+ch(REASONS.cancel)+note+foot('doCancel','ยืนยันยกเลิกงาน','primary danger');
  else if(t==='report')b=head('รายงานลูกค้า',esc(c.name))+ch(REASONS.report)+note+`<button class="opt" data-act="sfset" data-id="alsoBlock:${f.alsoBlock?0:1}" aria-pressed="${!!f.alsoBlock}" style="margin-top:12px">บล็อกลูกค้ารายนี้ด้วย</button>`+foot('doReport','ส่งรายงาน');
  else if(t==='block')b=head('บล็อกลูกค้า',`คุณจะไม่เห็นงานจาก ${esc(c.name)} อีก`)+foot('doBlock','บล็อกลูกค้า','primary danger');
  else if(t==='rate')b=head('ให้คะแนนลูกค้า',`${esc(c.name)}`)+`<div class="stars">${[1,2,3,4,5].map(n=>`<button class="${f.stars>=n?'on':''}" data-act="sfset" data-id="stars:${n}" aria-label="${n} ดาว"><svg class="ic"><use href="#i-star"/></svg></button>`).join('')}</div><div class="starlbl">${['','แย่มาก','แย่','พอใช้','ดี','ดีมาก'][f.stars]}</div>`+note+foot('doRate','ส่งคะแนน');
  else if(t==='complaint')b=head('ร้องเรียน','เลือกหัวข้อ ทีมงานจะติดต่อกลับ')+ch(REASONS.complaint)+note+foot('doComplaint','ส่งเรื่อง');
  else if(t==='sos')b=head('ฉุกเฉิน', 'โทรขอความช่วยเหลือหรือแจ้งเหตุ')+EMER.map(e=>tel(e[0],e[1])).join('')+(prof.emergency_phone?tel(prof.emergency_phone,'ผู้ติดต่อฉุกเฉิน '+esc(prof.emergency_name)):'')+(cfg.support?tel(cfg.support,'ฝ่ายดูแลไรเดอร์'):'')
    +'<button class="mrow" data-act="shareLoc"><span><svg class="ic"><use href="#i-pin"/></svg>แชร์ตำแหน่งปัจจุบัน</span></button><button class="mrow danger" data-act="sendSos"><span><svg class="ic"><use href="#i-alert"/></svg>ส่งสัญญาณ SOS ถึงฝ่ายดูแล</span></button>'
    +mr('chat','ร้องเรียน / แจ้งปัญหา','complaint:'+(active()?active().id:''))+msg+'<button class="secondary full" style="margin-top:16px" data-act="closeSheet">ปิด</button>';
  return `<div class="shbg" data-act="closeSheet"></div><div class="shpanel">${b}</div>`;
}

function shrink(file,max=640){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.78))};im.onerror=rej;im.src=u})}
document.addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0],sl=e.target.dataset&&e.target.dataset.slot;if(!f||!sl)return;
  try{toast('กำลังอัปโหลดรูป...');const url=await DB.photo(sl,await shrink(f));

    await DB.saveProfile(prof);toast('บันทึกรูปแล้ว')}catch(err){toast('อัปโหลดรูปไม่ได้: '+err.message)}
  render();
});

let map,pin,routeLine;
function initMap(){
  if(map||!window.L)return;
  map=L.map('realMap',{zoomControl:false,attributionControl:false,dragging:!L.Browser.mobile,tap:false}).setView([16.706,103.078],15);
  // ใช้แผนที่จาก CartoDB ป้องกันการโดน OSM บล็อก
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    className:'dark-map-tiles'
  }).addTo(map);
  
  pin=L.marker([16.706,103.078],{icon:L.divIcon({className:'',html:'<div class="map-dot"></div>',iconSize:[12,12],iconAnchor:[6,6]})}).addTo(map);
}

function updateMapRoute() {
  if(!map || !window.L) return;
  map.eachLayer((layer) => {
    if(layer instanceof L.Polyline || (layer instanceof L.Marker && layer !== pin)) {
      map.removeLayer(layer);
    }
  });
  
  const ja = active();
  if (ja && ja.pickup_lat && ja.pickup_lng && ja.dropoff_lat && ja.dropoff_lng) {
    const start = [ja.pickup_lat, ja.pickup_lng];
    const end = [ja.dropoff_lat, ja.dropoff_lng];
    
    routeLine = L.polyline([start, end], {color: '#ff5722', weight: 4, dashArray: '10, 10', opacity: 0.9}).addTo(map);
    
    L.marker(start, {icon: L.divIcon({className:'',html:'<div class="map-dot" style="background:#00e676;box-shadow:0 0 10px #00e676"></div>',iconSize:[12,12],iconAnchor:[6,6]})}).addTo(map).bindPopup(ja.pickup);
    L.marker(end, {icon: L.divIcon({className:'',html:'<div class="map-dot" style="background:#ff5722;box-shadow:0 0 10px #ff5722"></div>',iconSize:[12,12],iconAnchor:[6,6]})}).addTo(map).bindPopup(ja.dropoff);
    
    map.fitBounds(routeLine.getBounds(), { padding: [50, 50], maxZoom: 16 });
  } else {
    const p = pending();
    p.forEach(j => {
       if(j.pickup_lat && j.pickup_lng) {
           L.marker([j.pickup_lat, j.pickup_lng], {icon: L.divIcon({className:'',html:'<div class="map-dot" style="background:#ffb74d;box-shadow:0 0 10px #ffb74d"></div>',iconSize:[12,12],iconAnchor:[6,6]})}).addTo(map).bindPopup(j.shop);
       }
    });
  }
}

function watchGps(){
  const st=$('#mapGpsStatus');
  if(!navigator.geolocation){st.textContent='อุปกรณ์ไม่รองรับ GPS';return}
  navigator.geolocation.watchPosition(p=>{
    pos={lat:p.coords.latitude,lng:p.coords.longitude};
    if(pin)pin.setLatLng([pos.lat,pos.lng]);
    st.textContent=`GPS ${pos.lat.toFixed(3)}, ${pos.lng.toFixed(3)}`;
    if(online&&Date.now()-lastPush>15000){lastPush=Date.now();DB.presence(true).catch(()=>{})}
  },()=>{st.textContent='กรุณาเปิดสิทธิ์ GPS';st.style.color='#ff5252'},{enableHighAccuracy:true,timeout:20000});
}

window.addEventListener('DOMContentLoaded',async()=>{

  jobs=await DB.jobs();
  render();

});
