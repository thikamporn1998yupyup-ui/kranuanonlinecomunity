<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>กินไรดีวันนี้ · กระนวนใกล้บ้าน</title>
<style>
:root{--sun:#f9d35b;--chili:#e95e30;--ink:#2b1d14;--sheet:#fffaf0;--text:#332e29;--muted:#7a6a58;--line:#eadfce;--leaf:#2f7d4f;--leafbg:#e6f4ea}
@media (prefers-color-scheme:dark){:root{--sheet:#241d17;--text:#f3ebe0;--muted:#bfae98;--line:#4a3e33;--leaf:#8fd3a8;--leafbg:#243a2c}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.6 "Sarabun","Noto Sans Thai",Tahoma,sans-serif;background:var(--sun);color:var(--text);display:flex;flex-direction:column;min-height:100dvh}
.hero{flex:none;padding:calc(14px + env(safe-area-inset-top)) 18px 22px;color:var(--ink);position:relative;min-height:46dvh;display:flex;flex-direction:column}
.back{color:#7a351d;font-size:13px;text-decoration:none;align-self:flex-start;display:inline-flex;align-items:center;gap:4px}
.chips{display:flex;gap:7px;overflow-x:auto;margin:14px -18px 0;padding:2px 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1.5px solid #2b1d14;background:transparent;color:var(--ink);border-radius:20px;padding:5px 13px;font:inherit;font-size:13px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--sun)}
.stage{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-top:16px}
.sticker{display:block;width:132px;height:132px;transform:rotate(-6deg);margin-bottom:4px;filter:drop-shadow(0 5px 0 #2b1d1414)}
.name{margin:0;font-size:clamp(36px,11vw,54px);line-height:1.12;font-weight:800;letter-spacing:-.5px;overflow-wrap:anywhere}
.sheet{flex:1;background:var(--sheet);border-radius:28px 28px 0 0;padding:22px 20px calc(110px + env(safe-area-inset-bottom));max-width:100%}
.inner{max-width:520px;margin:auto}
.joke{margin:0 0 18px;font-size:19px;line-height:1.55;font-weight:600}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--leafbg);border-radius:14px;padding:12px 14px;font-size:14px}
.tip svg{flex:none;width:20px;height:20px;margin-top:2px;stroke:var(--leaf);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tip b{color:var(--leaf)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--sheet) 70%,transparent)}
.bar .inner{display:flex;gap:10px}
.bar button,.bar a{font:inherit;border:0;border-radius:16px;padding:15px 16px;cursor:pointer;text-align:center;text-decoration:none}
#spin{flex:1;background:var(--chili);color:#fff;font-size:19px;font-weight:700}
#spin:disabled{opacity:.75;cursor:wait}
#share{flex:none;background:var(--sun);color:var(--ink);font-size:15px;font-weight:600}
button:focus-visible,a:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}
.shuffle .name,.shuffle .sticker{opacity:.5}
.pop .sticker{animation:pop .35s ease}
@keyframes pop{0%{transform:rotate(-6deg) scale(.6)}60%{transform:rotate(-6deg) scale(1.12)}100%{transform:rotate(-6deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.pop .sticker{animation:none}}
</style>
</head>
<body>
<section class="hero" id="hero">
  <a class="back" href="/"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg> กลับหน้าแอพ</a>
  <div class="chips" id="chips" role="group" aria-label="เลือกประเภทอาหาร"></div>
  <div class="stage" aria-live="polite">
    <span class="sticker" id="emoji"></span>
    <h1 class="name" id="name">หิวแล้วใช่ไหม</h1>
  </div>
</section>
<section class="sheet">
  <div class="inner">
    <p class="joke" id="joke">กดสุ่มเลย เดี๋ยวบ้านเฮาตัดสินใจให้</p>
    <div class="tip" id="tip" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11Z"/></svg>
      <span id="tipText"></span>
    </div>
  </div>
</section>
<div class="bar"><div class="inner">
  <button id="spin" type="button">สุ่มเมนู</button>
  <button id="share" type="button" hidden>ส่งให้เพื่อน</button>
</div></div>
